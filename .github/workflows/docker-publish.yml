name: Build and publish Docker image

on:
  push:
    branches:
      - main
    # A release tag (v0.1.0) publishes the image as 0.1.0 and 0.1 as well.
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
  # Rebuild every day at 07:00 UTC, one hour after the ORION-DBs website
  # refreshes its schema files (06:00 UTC), so the schema snapshot baked into
  # the image is at most a day old. GitHub runs scheduled workflows only from
  # the default branch; the build job also checks this explicitly.
  schedule:
    - cron: "0 7 * * *"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Same base image and package snapshot as the Dockerfile; keep them in sync.
    container: rocker/r-ver:4.5.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # curl and jq are used by refresh-schemas.sh, which the tests exercise
      - name: Install system tools
        run: apt-get update && apt-get install -y --no-install-recommends curl jq libuv1t64

      - name: Install R packages
        run: |
          install2.r --error --skipinstalled \
            --repos https://p3m.dev/cran/__linux__/noble/2026-11-10 \
            testthat dplyr purrr stringr readr tibble glue jsonlite \
            gargle bigrquery ellmer mcptools

      - name: Run unit tests
        run: Rscript tests/test-functions.R

  build:
    # Pull requests are only tested. Scheduled runs build from the default
    # branch only.
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'schedule' ||
        github.ref_name == github.event.repository.default_branch)
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # A new value each run, so the layer that downloads the schema files
          # is not served from the build cache
          build-args: |
            SCHEMA_SNAPSHOT=${{ github.run_id }}-${{ github.run_attempt }}
          # Avoids the GitHub API rate limit for unauthenticated requests
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)